# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ar

reviews:
  profile: chill
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: AGENTS.md, CONTEXT.md, docs/agents/*.md, docs/adr/*.md
        applyTo: "**/*"
      - files: apps/api/AGENTS.md
        applyTo: apps/api/**
      - files: apps/web/AGENTS.md
        applyTo: apps/web/**
